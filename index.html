<html lang="ja">
<head>
<meta charset="utf-8">

<title>BUFFET</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">

<style>
:root{--gold:#c9a45c;--gold2:#e6c887;--ivory:#f3ead8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:#0e0a0f;color:var(--ivory);font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
button{font-family:inherit}
header{display:flex;align-items:center;gap:16px;padding:8px 14px;border-bottom:1px solid rgba(201,164,92,.35);background:#120d12}
h1{margin:0;font-size:16px;font-weight:500;letter-spacing:.4em;color:var(--gold2);white-space:nowrap}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#nav a{color:#b9a98a;text-decoration:none;font-size:13px;padding:4px 10px;white-space:nowrap;border-bottom:2px solid transparent;letter-spacing:.1em}
#nav a.on{color:var(--gold2);border-color:var(--gold)}
.wrap{position:relative;flex:1 1 0;min-height:0;overflow:hidden;font-size:clamp(9px,1.55vh,16px)}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 13%,rgba(255,214,140,.6),transparent 7em) 0 0/24em 100% repeat-x,linear-gradient(90deg,rgba(201,164,92,.09) 0 .15em,transparent .15em) 0 0/7em 100% repeat-x,linear-gradient(#0e0a0f,#2b1b23 72%,#3b2530)}
.wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
.walk{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;user-select:none}
.walk::-webkit-scrollbar{display:none}
.walk.grab{cursor:grabbing}
.track{position:relative;display:flex;align-items:flex-end;height:100%;width:max-content;min-width:100%;padding:0 3em}
.track::after{content:"";position:absolute;left:0;right:0;bottom:-1em;height:8em;z-index:0;border-top:.22em solid var(--gold);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.28)),repeating-linear-gradient(90deg,#f6f3ec 0 3em,#e4ded1 3em 3.35em,#f6f3ec 3.35em 6.35em);box-shadow:0 -1em 2em rgba(0,0,0,.5)}
.walking .track{animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(.3em)}}
.corner{position:relative;z-index:1;display:flex;align-items:flex-end;padding:0 1.6em;margin-bottom:4.4em}
.corner h3{position:absolute;left:50%;bottom:calc(100% + 3em);transform:translateX(-50%);margin:0;white-space:nowrap;font-size:1.3em;font-weight:700;letter-spacing:.3em;padding:.4em 1.2em .4em 1.5em;color:var(--gold2);background:#1b1319;border:.1em solid var(--gold);box-shadow:0 .4em 1em rgba(0,0,0,.6),inset 0 0 0 .2em #1b1319,inset 0 0 0 .28em rgba(201,164,92,.5)}
.corner h3::before,.corner h3::after{content:"";position:absolute;bottom:100%;width:.1em;height:14em;background:var(--gold);opacity:.8}
.corner h3::before{left:18%}.corner h3::after{right:18%}
.st{width:17em;display:flex;flex-direction:column;align-items:center;animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(1.5em)}}
.dish{position:relative;width:16em;height:11em}
.pan{position:absolute;left:0;right:0;bottom:0;height:7em;border-radius:50%;border:.16em solid #eef2f3;background:radial-gradient(ellipse at 50% 30%,#fdfdfd,#c8d0d3 55%,#8f9a9e);box-shadow:0 .7em 1.2em rgba(0,0,0,.55),inset 0 -.5em 1em rgba(0,0,0,.18)}
.pc{position:absolute;width:5em;height:5em;margin:-2.5em 0 0 -2.5em;padding:0;border:0;background:none;cursor:grab;transform:rotate(var(--r));transition:transform .15s,opacity .7s;filter:drop-shadow(0 .25em .2em rgba(0,0,0,.35))}
.pc svg{display:block;width:100%;height:100%;pointer-events:none}
.pc:hover,.pc:focus-visible{transform:rotate(var(--r)) translateY(-.4em) scale(1.12);outline:none;z-index:2}
.pc.taken{opacity:0;transition:none}
.card{position:relative;z-index:2;margin-top:-.8em;min-width:7em;padding:.3em 1em;text-align:center;white-space:nowrap;font-size:1.2em;font-weight:700;letter-spacing:.12em;color:#3b2a12;background:linear-gradient(#fffdf5,#efe3c8);border:.1em solid var(--gold);border-radius:.2em;box-shadow:0 .3em .6em rgba(0,0,0,.45),inset 0 0 0 .15em rgba(255,255,255,.55);transform:perspective(20em) rotateX(8deg)}
.steam{position:absolute;left:25%;right:25%;top:-.5em;height:4em;z-index:3;pointer-events:none}
.steam i{position:absolute;bottom:0;width:1.6em;height:1.6em;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(.5em);opacity:0;animation:steam 3.4s infinite}
.steam i:nth-child(1){left:10%}.steam i:nth-child(2){left:45%;animation-delay:1.1s}.steam i:nth-child(3){left:75%;animation-delay:2.2s}
@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:.5}100%{opacity:0;transform:translateY(-3.5em) scale(1.6)}}
.arw{position:absolute;top:50%;z-index:3;width:2em;height:3.4em;margin-top:-5em;background:rgba(14,10,15,.65);border:1px solid var(--gold);color:var(--gold2);font-size:1.8em;line-height:1;cursor:pointer}
.arw.l{left:0;border-left:0;border-radius:0 .5em .5em 0}.arw.r{right:0;border-right:0;border-radius:.5em 0 0 .5em}
.arw:active{background:var(--gold);color:#1b1319}
.tray-zone{flex:0 0 45dvh;display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px;background:linear-gradient(#1a1218,#0b080b);border-top:2px solid var(--gold);box-shadow:0 -10px 30px rgba(0,0,0,.6);position:relative;z-index:3}
.bar{display:flex;gap:6px;align-items:center;max-width:960px;width:100%;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.bar button{font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold2);cursor:pointer;white-space:nowrap}
.bar button[aria-pressed=true]{background:var(--gold);color:#1b1319}
.bar button:disabled{opacity:.3;cursor:default}
.bar .n{margin-left:auto;font-size:13px;color:#b9a98a;white-space:nowrap}
#plate{flex:1 1 0;min-height:0;width:100%;max-width:960px;margin:0 auto;touch-action:none;user-select:none}
#base{filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
#items>g{cursor:grab}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(1.25)}to{transform:scale(1)}}
.ring{display:none;fill:none;stroke:var(--gold2);stroke-width:2.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.sel .ring{display:block}
.ping{fill:none;stroke:var(--gold2);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping .6s ease-out forwards}
@keyframes ping{from{transform:scale(.3);opacity:.9}to{transform:scale(2.4);opacity:0}}
#hint{fill:#8b9a9c;font-size:15px;text-anchor:middle;pointer-events:none;letter-spacing:.1em}
.ghost{position:fixed;pointer-events:none;z-index:9;filter:drop-shadow(0 .5em .4em rgba(0,0,0,.5))}
.ghost svg{display:block;width:100%;height:100%}
@media(prefers-reduced-motion:reduce){.steam{display:none}.walking .track,.st,.pop{animation:none}}
</style>
</head>

['orange','オレンジジュース',7,glass('#f59a23',ice+'<path d="M8-24L22-48" stroke="#d63a2e" stroke-width="4" stroke-linecap="round"/>')],
['cola','コーラ',7,glass('#3a1a10',ice)],

['milk','ミルク',7,glass('#f7f3ea','')],
['coffee','コーヒー',7,'<circle r="30" fill="#fff" stroke="#c9d1d3" stroke-width="3"/><circle r="22" fill="#4a2410"/><path d="M30-8q16 0 14 10q-2 10-14 8" stroke="#b9c3c5" stroke-width="5" fill="none"/><path d="M-8-6q8-8 16 0" stroke="#8a5a3a" stroke-width="3" fill="none"/>']
];
const PLATES={
'丸皿':'<circle cx="200" cy="200" r="188" fill="#fff"/><circle cx="200" cy="200" r="146" fill="#f4f7f7" stroke="#dde4e5" stroke-width="5"/>',
'角皿':'<rect x="16" y="16" width="368" height="368" rx="40" fill="#fff"/><rect x="48" y="48" width="304" height="304" rx="22" fill="#f4f7f7" stroke="#dde4e5" stroke-width="5"/>',
'楕円皿':'<ellipse cx="200" cy="200" rx="192" ry="140" fill="#fff"/><ellipse cx="200" cy="200" rx="152" ry="102" fill="#f4f7f7" stroke="#dde4e5" stroke-width="5"/>',
'仕切り皿':'<rect x="10" y="36" width="380" height="328" rx="34" fill="#e9d9bf"/><g fill="#fbf5ea"><rect x="28" y="54" width="170" height="292" rx="18"/><rect x="210" y="54" width="162" height="140" rx="18"/><rect x="210" y="206" width="162" height="140" rx="18"/></g>',
'どんぶり':'<circle cx="200" cy="200" r="188" fill="#a63a2e"/><circle cx="200" cy="200" r="168" fill="none" stroke="#d2a64e" stroke-width="6"/><circle cx="200" cy="200" r="150" fill="#f3ebde"/>'
};
$('#defs').innerHTML=FOODS.map(f=>`<g id="f-${f[0]}">${f[3]}</g>`).join('');
const HOT=[0,1,2,3,4];
const PS=[[50,22],[30,36],[70,36],[16,54],[38,54],[62,54],[84,54],[28,72],[50,74],[72,72]];
const walk=$('#walk'),track=$('#track'),bg=$('#bg'),svg=$('#plate'),items=$('#items');
track.innerHTML=CATS.map((c,i)=>`<section class="corner" id="c${i}"><h3>${c}</h3>${FOODS.filter(f=>f[2]===i).map(f=>`<div class="st"><div class="dish">${HOT.includes(i)?'<div class="steam"><i></i><i></i><i></i></div>':''}<div class="pan"></div>${PS.map((q,k)=>`<button class="pc" data-id="${f[0]}" aria-label="${f[1]}をとる" style="left:${q[0]}%;top:${q[1]}%;--r:${(k*47%29)-14}deg"><svg viewBox="-50 -50 100 100"><use href="#f-${f[0]}"/></svg></button>`).join('')}</div><div class="card">${f[1]}</div></div>`).join('')}</section>`).join('');
$('#nav').innerHTML=CATS.map((c,i)=>`<a href="#c${i}">${c.replace('コーナー','')}</a>`).join('');
const links=[...document.querySelectorAll('#nav a')],corners=[...document.querySelectorAll('.corner')];

// ---- 歩く ----
links.forEach((a,i)=>a.onclick=e=>{e.preventDefault();walk.scrollTo({left:corners[i].offsetLeft-16,behavior:'smooth'})});
let wt,dir=0,pan=null;
walk.addEventListener('scroll',()=>{
 const x=walk.scrollLeft;bg.style.backgroundPosition=`${-x*.4}px 0,${-x*.4}px 0,0 0`;
 walk.classList.add('walking');clearTimeout(wt);wt=setTimeout(()=>walk.classList.remove('walking'),160);
 const mid=x+walk.clientWidth/2;let cur=0;corners.forEach((c,i)=>{if(c.offsetLeft<=mid)cur=i});
 links.forEach((a,i)=>a.classList.toggle('on',i===cur));
});
walk.dispatchEvent(new Event('scroll'));
walk.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){walk.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
const loop=()=>{if(dir){walk.scrollLeft+=dir*9;requestAnimationFrame(loop)}};
document.querySelectorAll('.arw').forEach(b=>{
 b.addEventListener('pointerdown',()=>{dir=+b.dataset.d;loop()});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>dir=0));
});
addEventListener('pointermove',e=>{if(pan)walk.scrollLeft=pan.l-(e.clientX-pan.x)});
addEventListener('pointerup',()=>{pan=null;walk.classList.remove('grab')});

// ---- トレー ----
const chips=[];$('#chips').innerHTML=Object.keys(PLATES).map(k=>`<button aria-pressed="false">${k}</button>`).join('');
document.querySelectorAll('#chips button').forEach(b=>{chips.push(b);b.onclick=()=>{chips.forEach(c=>c.setAttribute('aria-pressed',c===b));$('#base').innerHTML=PLATES[b.textContent]}});
chips[0].click();
let sel=null,drag=null;
const P=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
const S=(x,y)=>{const p=svg.createSVGPoint();p.x=x;p.y=y;const q=p.matrixTransform(svg.getScreenCTM());return{x:q.x,y:q.y}};
const cx=v=>Math.max(30,Math.min(610,v)),cy=v=>Math.max(30,Math.min(310,v));
const put=g=>g.setAttribute('transform',`translate(${g.d.x} ${g.d.y}) rotate(${g.d.r}) scale(${g.d.s})`);
function ui(){
 document.querySelectorAll('.tb [data-a]:not([data-a=clear])').forEach(b=>b.disabled=!sel);
 const n=items.children.length;$('#count').textContent=n+'こ';$('#hint').style.display=n?'none':'';
}
function pick(g){if(sel)sel.classList.remove('sel');sel=g;if(g){g.classList.add('sel');items.appendChild(g)}ui()}
function add(id,x,y,r){
 const g=document.createElementNS(NS,'g');g.d={x:cx(x),y:cy(y),r,s:1};
 g.innerHTML=`<g class="pop"><use href="#f-${id}"/></g><circle class="ring" r="58"/>`;put(g);items.appendChild(g);pick(g);
 const c=document.createElementNS(NS,'circle');c.setAttribute('class','ping');c.setAttribute('cx',g.d.x);c.setAttribute('cy',g.d.y);c.setAttribute('r',16);
 svg.append(c);setTimeout(()=>c.remove(),650);
}
svg.addEventListener('pointerdown',e=>{
 const g=e.target.closest('#items>g');if(!g){pick(null);return}
 pick(g);const p=P(e);drag={g,dx:g.d.x-p.x,dy:g.d.y-p.y};svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=P(e);drag.g.d.x=cx(p.x+drag.dx);drag.g.d.y=cy(p.y+drag.dy);put(drag.g)});
['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>drag=null));

// ---- 料理を取る ----
function fly(id,r,to,rot,done){
 const w=r.width,c={x:r.left+w/2,y:r.top+r.height/2},g=document.createElement('div');
 g.className='ghost';g.style.cssText=`left:${c.x-w/2}px;top:${c.y-w/2}px;width:${w}px;height:${w}px`;
 g.innerHTML=`<svg viewBox="-50 -50 100 100"><use href="#f-${id}"/></svg>`;document.body.append(g);
 const dx=to.x-c.x,dy=to.y-c.y,k=100*svg.getScreenCTM().a/w;
 g.animate([{transform:'none'},{transform:`translate(${dx*.5}px,${dy*.5-70}px) scale(${(1+k)/2+.2}) rotate(${rot/2}deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${k}) rotate(${rot}deg)`}],{duration:560,easing:'cubic-bezier(.35,.05,.3,1)'}).onfinish=()=>{g.remove();done()};
}
function grab(pc){
 if(pc.classList.contains('taken'))return;
 const id=pc.dataset.id,a=rnd(0,6.28),d=rnd(0,62),tx=230+Math.cos(a)*d,ty=170+Math.sin(a)*d*.8,rot=rnd(-20,20);
 pc.classList.add('taken');setTimeout(()=>pc.classList.remove('taken'),1100);
 fly(id,pc.getBoundingClientRect(),S(tx,ty),rot,()=>add(id,tx,ty,rot));
}
walk.addEventListener('pointerdown',e=>{
 const pc=e.target.closest('.pc');
 if(!pc){if(e.pointerType==='mouse'){pan={x:e.clientX,l:walk.scrollLeft};walk.classList.add('grab')}return}
 if(e.pointerType==='touch')return; // タッチはタップで取る
 e.preventDefault();pc._m=true;const sx=e.clientX,sy=e.clientY,w=pc.getBoundingClientRect().width;let ghost=null;
 const mv=ev=>{
  if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=document.createElement('div');ghost.className='ghost';ghost.style.cssText=`width:${w}px;height:${w}px;margin:${-w/2}px 0 0 ${-w/2}px`;ghost.innerHTML=`<svg viewBox="-50 -50 100 100"><use href="#f-${pc.dataset.id}"/></svg>`;document.body.append(ghost);pc.classList.add('taken')}
  if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'}
 };
 const up=ev=>{
  removeEventListener('pointermove',mv);removeEventListener('pointerup',up);setTimeout(()=>pc._m=false,80);
  if(!ghost){grab(pc);return}
  ghost.remove();const r=svg.getBoundingClientRect();
  if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){const q=P(ev);add(pc.dataset.id,q.x,q.y,rnd(-20,20));setTimeout(()=>pc.classList.remove('taken'),1000)}
  else pc.classList.remove('taken');
 };
 addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
walk.addEventListener('click',e=>{const pc=e.target.closest('.pc');if(pc&&!pc._m)grab(pc)}); // タッチ・キーボード用

// ---- 調整ボタン ----
const act={small:g=>g.d.s=Math.max(.5,g.d.s/1.15),big:g=>g.d.s=Math.min(2.4,g.d.s*1.15),turn:g=>g.d.r+=30,del:g=>{g.remove();pick(null)}};
document.querySelectorAll('.tb [data-a]').forEach(b=>b.onclick=()=>{
 if(b.dataset.a==='clear'){items.innerHTML='';pick(null);return}
 if(!sel)return;act[b.dataset.a](sel);if(sel)put(sel);
});
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')walk.scrollBy({left:-280,behavior:'smooth'});
 if(e.key==='ArrowRight')walk.scrollBy({left:280,behavior:'smooth'});
 if(sel&&(e.key==='Delete'||e.key==='Backspace')&&!/BUTTON/.test(document.activeElement.tagName)){sel.remove();pick(null)}
});
</script>
</body>
</html>
